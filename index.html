<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A little surprise 🔒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Caveat:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFF6F9;--ink:#2A2140;--butter:#FFE08A;--mint:#9EE3C8;--rose:#FF8FB1}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    color:var(--paper);font-family:"Nunito",system-ui,sans-serif;overflow:hidden;
    background:#0A0E24;background-image:radial-gradient(120% 80% at 50% 110%,#3B2350 0%,#1A0F2E 45%,#090D22 100%);
    display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;
  }
  #sky{position:fixed;inset:0;pointer-events:none}
  .glow{position:fixed;left:50%;bottom:-30vh;width:120vw;height:60vh;transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,170,80,.18),transparent)}
  main{position:relative;width:100%;max-width:24rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.1rem}
  .lantern{width:64px;height:78px;position:relative;animation:float 4s ease-in-out infinite}
  .lantern::before{content:"";position:absolute;inset:0;border-radius:14px 14px 22px 22px / 12px 12px 30px 30px;
    clip-path:polygon(4% 0,96% 0,82% 100%,18% 100%);
    background:radial-gradient(120% 90% at 50% 100%,#FFF6D6 0%,#FFCB72 25%,#FF9D3E 60%,#C9601F 100%)}
  .lantern::after{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,70,.45),transparent)}
  @keyframes float{50%{transform:translateY(-10px) rotate(-2deg)}}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.1;margin:0}
  p{margin:0;line-height:1.5;opacity:.85}
  form{width:100%;display:flex;flex-direction:column;gap:.8rem;margin-top:.4rem}
  label{font-family:"Caveat",cursive;font-size:1.5rem;color:#FFE9D2}
  input{
    width:100%;font:800 1.4rem "Nunito",sans-serif;letter-spacing:.12em;text-align:center;color:var(--ink);
    background:var(--paper);border:0;border-radius:14px;padding:.85rem 1rem;box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  input::placeholder{color:#B9AFC6;letter-spacing:.08em}
  input:focus-visible,button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
  button{font:800 1.05rem "Nunito",sans-serif;color:var(--ink);background:var(--butter);border:0;border-radius:999px;
    padding:.85rem 1.7rem;cursor:pointer;box-shadow:0 4px 0 rgba(42,33,64,.45)}
  button:disabled{opacity:.6;cursor:progress}
  .msg{min-height:1.5em;font-size:.95rem}
  .msg.err{color:var(--rose)}
  .shake{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @media (prefers-reduced-motion: reduce){.lantern,.shake{animation:none}}
  noscript{color:var(--butter)}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main>
  <div class="lantern" aria-hidden="true"></div>
  <h1>A little surprise is waiting</h1>
  <p>It's locked with a very special date.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Enter your birthday</label>
    <input id="pw" inputmode="numeric" placeholder="dd-mm-yyyy" maxlength="10" aria-describedby="msg" required>
    <button id="go" type="submit">Unlock</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>
  <noscript>Please turn on JavaScript to open this page.</noscript>
</main>

const b64e = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} } };

async function deriveRaw(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64d(SALT), iterations: ITER }, base, 256));
}
async function openWith(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const data = b64d(PAYLOAD);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12)));
  ss.set("bday-key", b64e(raw));
  document.open(); document.write(html); document.close();
}

// format digits as dd-mm-yyyy while typing
const pw = document.getElementById("pw"), msg = document.getElementById("msg"), btn = document.getElementById("go");
pw.addEventListener("input", () => {
  const d = pw.value.replace(/\D/g, "").slice(0, 8);
  pw.value = d.length > 4 ? d.slice(0, 2) + "-" + d.slice(2, 4) + "-" + d.slice(4) : d.length > 2 ? d.slice(0, 2) + "-" + d.slice(2) : d;
});
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const d = pw.value.replace(/\D/g, "");
  msg.className = "msg";
  if (d.length !== 8) { msg.className = "msg err"; msg.textContent = "Use the format dd-mm-yyyy, like 01-01-2000."; return; }
  btn.disabled = true; msg.textContent = "Opening…";
  try { await openWith(await deriveRaw(d.slice(0, 2) + "-" + d.slice(2, 4) + "-" + d.slice(4))); }
  catch (err) {
    btn.disabled = false; msg.className = "msg err"; msg.textContent = "That's not the date. Try again!";
    pw.classList.remove("shake"); void pw.offsetWidth; pw.classList.add("shake"); pw.select();
  }
});
if (!window.crypto || !crypto.subtle) { msg.className = "msg err"; msg.textContent = "Please open this page in an up-to-date browser (Chrome, Safari or Edge)."; btn.disabled = true; }
// already unlocked in this tab (e.g. "Open it again")
const saved = ss.get("bday-key");
if (saved && window.crypto && crypto.subtle) openWith(b64d(saved)).catch(() => {});
else pw.focus();

// quiet twinkling stars
(() => {
  const c = document.getElementById("sky"), g = c.getContext("2d"); let W, H, S = [];
  function size() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    S = Array.from({ length: Math.round(W * H / 2500) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() ** 2.4 + .3, p: Math.random() * 6.3, s: .5 + Math.random() * 2 })); }
  addEventListener("resize", size); size();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function f(t) { g.clearRect(0, 0, W, H); for (const o of S) { g.globalAlpha = still ? .8 : .45 + .45 * Math.sin(t / 1000 * o.s + o.p); g.fillStyle = "#fff"; g.beginPath(); g.arc(o.x, o.y, o.r, 0, 6.3); g.fill(); } requestAnimationFrame(f); })(0);
})();
